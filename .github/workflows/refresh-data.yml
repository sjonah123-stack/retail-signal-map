name: Refresh market data

# Zillow publishes mid-month; Census releases ACS each December, population estimates each spring and
# building permits each spring. This rebuilds data/ and commits only when something changed.
on:
  schedule:
    - cron: "0 12 20 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  # Downloads and parses third-party files, so it can write repository contents and nothing else.
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build market data
        run: python3 scripts/build_market_data.py --cache "$RUNNER_TEMP/cache"
      # The token is only handed to git for the push, after the downloads have been parsed.
      - name: Commit if changed
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh market data"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with the built-in token don't trigger other workflows, so deploy here.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
